name: Portability

# Dimensions cmake.yml does not reach: capability paths, 32-bit, non-x86, BSD.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  capability-paths:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fork instead of posix_spawn
            defs: -DSUBPROCESS_SPAWN_VIA_FORK=1
          - name: no chdir file action, no exec error reporting
            defs: -DSUBPROCESS_HAVE_CWD=0 -DSUBPROCESS_SPAWN_REPORTS_EXEC_ERRORS=0
          - name: no chdir file action only
            defs: -DSUBPROCESS_HAVE_CWD=0
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="${{ matrix.defs }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.defs }}"
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  linux-32-bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Build and test
        run: |
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test -B build -A Win32
      - run: cmake --build build --config RelWithDebInfo
      - run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  musl:
    runs-on: ubuntu-latest
    container: alpine:3
    steps:
      - name: Install toolchain
        run: apk add --no-cache gcc g++ musl-dev cmake make linux-headers git
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S test -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  # Builds everything, runs only *divzero: qemu-user does not propagate the
  # errno posix_spawn reports a failed exec with, so the rest fails here on
  # every architecture regardless of target.
  foreign-arch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ppc64le, riscv64, s390x, armv7]
    name: linux ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu_latest
          install: |
            apt-get update -q
            apt-get install -q -y build-essential cmake
          run: |
            cmake -S test -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
            cmake --build build -j
            cd build && ./subprocess_test '--filter=*divzero'

  # NetBSD twice on purpose: addchdir arrived in 10.0, so 9.x takes another path.
  bsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: "14.3"
            run: |
              sudo pkg install -y cmake
              cmake -S test -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
              cmake --build build
              ctest --test-dir build --output-on-failure
          # 9.x pkgsrc binaries are gone from the CDN. Build and run the full
          # subprocess suite with base compilers to retain pre-10.0 coverage.
          - os: netbsd
            version: "9.4"
            run: |
              mkdir build
              for source in test/process_*.c; do
                cc -I. "$source" -o "build/$(basename "${source%.c}")"
              done
              cc -I. -std=gnu89 -c test/main.c -o build/main.o
              cc -I. -std=gnu89 -c test/test.c -o build/test.o
              cc -I. -std=c99 -c test/test99.c -o build/test99.o
              cc -I. -std=c11 -c test/test11.c -o build/test11.o
              c++ -I. -c test/test.cpp -o build/test-cpp.o
              c++ -I. -std=gnu++98 -c test/test98.cpp -o build/test98.o
              c++ -I. -std=c++11 -c test/test11.cpp -o build/test11-cpp.o
              c++ -I. -std=c++14 -c test/test14.cpp -o build/test14.o
              c++ -I. -std=c++17 -c test/test17.cpp -o build/test17.o
              c++ -I. -c test/test20.cpp -o build/test20.o
              c++ -I. -c test/pre_windows.cpp -o build/pre_windows.o
              c++ -I. -c test/post_windows.cpp -o build/post_windows.o
              c++ build/*.o -o build/subprocess_test
              (cd build && ./subprocess_test)
          - os: netbsd
            version: "10.1"
            run: |
              sudo pkgin -y install cmake
              cmake -S test -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
              cmake --build build
              ctest --test-dir build --output-on-failure
          - os: openbsd
            version: "7.9"
            run: |
              sudo pkg_add cmake
              cmake -S test -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
              cmake --build build
              ctest --test-dir build --output-on-failure
    name: ${{ matrix.os }} ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          run: |
            ${{ matrix.run }}

  macos-deployment-target:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["10.14", "10.15", "11.0"]
    name: macOS deployment target ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S test -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.target }}
          cmake --build build -j
          ctest --test-dir build --output-on-failure
